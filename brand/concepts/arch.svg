<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -15 253 129" width="253" height="129" role="img" aria-label="ANI">
  <title>ANI</title>
  <g fill="none" stroke="#b5674a" stroke-width="16" stroke-linecap="butt">
    <!-- A: the arched mirror — flat feet, round-top arch, low crossbar -->
    <path d="M 6,100 L 6,39 A 34,34 0 0 1 74,39 L 74,100"/>
    <path d="M 6,72 L 74,72"/>
    <!-- N: left stem turns into the diagonal through a rounded hairpin -->
    <path d="M 115,100 L 115,7 L 177,92" stroke-linejoin="round"/>
  </g>
  <!-- N right stem and I: columns with domed (arched) tops, flat feet -->
  <path d="M 169,100 L 169,7 A 8,8 0 0 1 185,7 L 185,100 Z" fill="#b5674a"/>
  <path d="M 210,100 L 210,7 A 8,8 0 0 1 226,7 L 226,100 Z" fill="#b5674a"/>
  <!-- bindi in the mirror -->
  <circle cx="40" cy="37" r="10" fill="#8a6aa3"/>
</svg>
