<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>ANI — maison cipher</title>
  <g transform="translate(0 0)">
    <g fill="#b5674a">
      <!-- A left leg (hairline) -->
      <path d="M88.2 30 L91.8 30 L41.8 170 L38.2 170 Z"/>
      <!-- N left stem (hairline) -->
      <rect x="88.2" y="30" width="3.6" height="140"/>
      <!-- shared stroke: right leg of A = diagonal of N; stops short, passing behind the I -->
      <path d="M88.2 30 L98.8 30 L147.8 170 L137.2 170 Z"/>
      <!-- the I : stem with hairline serifs -->
      <rect x="152" y="30" width="8" height="140"/>
      <rect x="142" y="27.2" width="28" height="2.8"/>
      <rect x="142" y="170" width="28" height="2.8"/>
      <!-- feet -->
      <rect x="30" y="170" width="20" height="2.8"/>
      <rect x="80" y="170" width="20" height="2.8"/>
      <!-- A crossbar, woven behind the stem -->
      <rect x="60.5" y="116" width="26.1" height="2.8"/>
      <rect x="93.4" y="116" width="25.4" height="2.8"/>
      <!-- temple-jewellery drop, hung from the crossbar -->
      <rect x="72.8" y="118.8" width="1.4" height="4.4"/>
      <circle cx="73.5" cy="124.9" r="2.1"/>
      <path d="M73.5 127.4 C79.3 134.2 81.1 138.9 81.1 144 A7.6 7.6 0 0 1 65.9 144 C65.9 138.9 67.7 134.2 73.5 127.4 Z"/>
      <circle cx="73.5" cy="154.1" r="1.8"/>
    </g>
  </g>
</svg>
